<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- seguridad: solo carga archivos de esta web, Google Fonts y las estadísticas (GoatCounter) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://*.goatcounter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://gc.zgo.at; connect-src https://*.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noai, noimageai">
<script>try{ if(top !== self) top.location = self.location; }catch(_){} // que no te metan en un iframe</script>
<title>Read | DEADLY SWAMPED</title>
<meta name="description" content="Read DEADLY SWAMPED, a webtoon set in the world of Nyris.">
<meta name="theme-color" content="#0b070d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="DEADLY SWAMPED" href="feed.xml">
<!-- vista previa al compartir. Si algún día cambias de dirección, cambia https://yibiart.github.io/deadlyswamped aquí y en SITE más abajo. Es la misma para todos los capítulos -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="DEADLY SWAMPED">
<meta property="og:title" content="Read DEADLY SWAMPED">
<meta property="og:description" content="A webtoon set in the world of Nyris. Where the last flame dreams of the dead.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--negro:#0b070d;--vino:#1d0a14;--sangre:#b3122f;--brillo:#ff3d5e;--hueso:#ece3e4;--suave:#a898a3;--titulo:'Pirata One','Times New Roman',serif;--elegante:'Cormorant Garamond',Georgia,serif;--cuerpo:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:#050307;color:var(--hueso);font-family:var(--cuerpo);line-height:1.6}
a{color:inherit}
:focus-visible{outline:2px solid var(--brillo);outline-offset:3px}

/* barra de arriba: izquierda home y redes, centro el título, derecha anterior/siguiente */
.barra{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.8rem;padding:.65rem 4vw;background:#0b070df2;border-bottom:1px solid #ffffff1a}
.izq,.der{display:flex;align-items:center;gap:.5rem}
.der{justify-content:flex-end}
.logo{font-family:var(--titulo);font-size:1.45rem;text-decoration:none;white-space:nowrap;transition:color .2s}
.logo:hover{color:var(--brillo)}
.btn{border:1px solid #ffffff44;background:none;color:var(--hueso);padding:.35rem 1rem;font:inherit;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--brillo);color:var(--brillo)}
.btn[aria-disabled=true]{opacity:.3;pointer-events:none}
.izq .redes{display:flex;gap:.4rem}
.ico{width:34px;height:34px;display:grid;place-items:center;border:1px solid #ffffff2e;color:var(--suave);transition:.2s}
.ico:hover{color:var(--brillo);border-color:var(--brillo)}
.ico svg{width:16px;height:16px;fill:currentColor}
.prog{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--brillo)}

/* cabecera del capítulo */
.cab{max-width:760px;margin:0 auto;padding:2.2rem 1.2rem 1.6rem}
.cab .num{font-family:var(--elegante);font-style:italic;font-size:1.3rem;color:var(--brillo)}
.cab h1{font-family:var(--titulo);font-weight:400;font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:.15rem 0 1rem}
.datos{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;color:var(--suave);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.datos .btn svg{width:14px;height:14px;vertical-align:-2px;margin-right:.45rem;fill:none;stroke:currentColor;stroke-width:2}
.datos .btn[aria-pressed=true]{border-color:var(--brillo);color:var(--brillo)}
.datos .btn[aria-pressed=true] svg{fill:var(--brillo)}
.datos time{margin-left:auto}

/* páginas del capítulo */
#tira{max-width:760px;margin:0 auto;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tira img{display:block;width:100%;height:auto;-webkit-user-drag:none}
.demo{aspect-ratio:5/8;display:grid;place-items:center;text-align:center;padding:2rem;border-bottom:1px solid #ffffff10;
  background:radial-gradient(circle at 50% 30%,#b3122f55,transparent 45%),linear-gradient(var(--vino),var(--negro));font-family:var(--titulo);font-size:2.6rem;color:#ffffff66}
.demo small{display:block;font-family:var(--cuerpo);font-size:.9rem;margin-top:1rem;color:var(--suave);max-width:24rem}

/* final del capítulo */
.fin{text-align:center;padding:3rem 1rem 1.5rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.pie-redes{display:none;justify-content:center;gap:.6rem;padding-bottom:1rem}
.tip{display:flex;gap:.4rem 1.4rem;justify-content:center;flex-wrap:wrap;padding:0 1rem 4rem;color:var(--suave);font-size:.8rem;letter-spacing:.06em}
.tip a{text-underline-offset:4px}.tip a:hover{color:var(--brillo)}
@media(hover:none){.teclas{display:none}}

/* aviso de contenido: una franja normal dentro de la página, no bloquea nada */
.cw{margin-top:1.1rem;padding:.7rem 1rem;border-left:3px solid var(--sangre);background:#b3122f1f;color:var(--hueso);font-size:.9rem;line-height:1.5}
.cw[hidden]{display:none}
.cw strong{color:var(--brillo);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem;margin-right:.5rem}

/* nota del autor */
.nota{max-width:760px;margin:2.5rem auto 0;padding:0 1.2rem}
.nota[hidden]{display:none}
.nota>div{padding:1.4rem 1.6rem;border:1px solid #ffffff1f;border-left:3px solid var(--brillo);background:linear-gradient(110deg,#b3122f22,transparent 70%),var(--vino)}
.nota h2{font-family:var(--titulo);font-weight:400;font-size:1.7rem;margin-bottom:.5rem}
.nota p{font-family:var(--elegante);font-size:1.25rem;line-height:1.5;margin-top:.6rem}

/* volver arriba y aviso de "sigues por aquí" */
.arriba{position:fixed;right:1rem;bottom:1rem;z-index:11;width:46px;height:46px;border-radius:50%;border:1px solid #fff4;background:#0b070de6;color:var(--hueso);cursor:pointer;display:grid;place-items:center;padding:0;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .25s,border-color .2s,color .2s}
.arriba.ver{opacity:1;pointer-events:auto;transform:none}
.arriba:hover{border-color:var(--brillo);color:var(--brillo)}
.arriba svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.retoma{position:fixed;left:1rem;bottom:1rem;z-index:11;max-width:calc(100% - 5rem);display:flex;align-items:center;gap:.9rem;padding:.55rem 1rem;background:#0b070df2;border:1px solid #ffffff33;font-size:.85rem}
.retoma[hidden]{display:none}
.retoma button{background:none;border:0;color:var(--brillo);font:inherit;text-decoration:underline;cursor:pointer;white-space:nowrap;padding:0}

@media(max-width:800px){
  .izq .redes{display:none}
  .pie-redes{display:flex}
  .tx{display:none}
  .btn{padding:.35rem .8rem}
}
@media(max-width:480px){
  .barra{padding:.55rem 3vw;gap:.4rem}
  .logo{font-size:1.1rem}
  .datos time{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="barra">
  <div class="izq">
    <a class="btn" href="index.html" aria-label="Back to home">←<span class="tx"> Home</span></a>
    <div class="redes"></div>
  </div>
  <a class="logo" href="index.html">DEADLY SWAMPED</a>
  <div class="der">
    <!-- botón para probar el lector con imágenes de tu ordenador. Solo sale si abres leer.html?c=0&probar -->
    <label class="btn" id="probar" hidden>Test<input type="file" id="prueba" accept="image/*" multiple hidden></label>
    <a class="btn" id="ant" href="#" aria-label="Previous chapter">‹<span class="tx"> Prev</span></a>
    <a class="btn" id="sig" href="#" aria-label="Next chapter"><span class="tx">Next </span>›</a>
  </div>
  <div class="prog" id="prog"></div>
</header>

<div class="cab">
  <p class="num" id="num"></p>
  <h1 id="tit"></h1>
  <div class="datos">
    <button class="btn" id="like" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><span id="liketxt">Like</span></button>
    <time id="fecha"></time>
  </div>
  <p class="cw" id="cw" hidden><strong>Content note</strong><span id="cwtxt"></span></p>
</div>

<main id="tira"></main>

<section class="nota" id="nota" hidden><div><h2>Author's note</h2><div id="notatxt"></div></div></section>

<div class="fin">
  <a class="btn" id="ant2" href="#">‹ Previous chapter</a>
  <a class="btn" href="index.html#leer">All chapters</a>
  <a class="btn" id="sig2" href="#">Next chapter ›</a>
</div>
<div class="pie-redes redes"></div>
<p class="tip"><span class="teclas">Tip: ← → change chapter · ↑ ↓ scroll</span><a id="mail" href="#" hidden>Report a problem</a></p>

<button class="arriba" id="arriba" aria-label="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
<div class="retoma" id="retoma" role="status" hidden><span>Continuing where you left off</span><button id="reinicia">Start over</button></div>


<script src="capitulos.js"></script>
<script>
const $ = id => document.getElementById(id);

/* tus redes: cambia el # por tu enlace */
const REDES = [
  {n:"Instagram", u:"#", linea:true, d:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>'},
  {n:"X",         u:"#", d:'<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>'},
  {n:"TikTok",    u:"#", d:'<path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/>'},
  {n:"YouTube",   u:"#", d:'<path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6z"/>'}
];

/* aviso de contenido que sale en TODOS los capítulos (debajo del título, sin ventana emergente).
   Para cambiarlo en un capítulo concreto pon aviso:"..." en capitulos.js, y aviso:"" si ese capítulo no lleva ninguno */
const AVISO_CONTENIDO = "This story contains violence and dark themes. Reader discretion is advised.";

/* tu correo partido en dos (anti-spam). Mientras esté vacío no sale el enlace "Report a problem" */
const CONTACTO = {usuario:"yibivamp", dominio:"gmail.com"};

/* estadísticas sin cookies (GoatCounter): pon el código de tucodigo.goatcounter.com. Vacío = desactivado */
const STATS = "yibi";

/* dirección de tu web, con barra al final (sirve para el enlace canónico de cada capítulo) */
const SITE = "https://yibiart.github.io/deadlyswamped/";

const c = +new URLSearchParams(location.search).get("c") || 0;
const cap = typeof capitulos !== "undefined" ? capitulos[c] : null;
try { history.scrollRestoration = "manual"; } catch(_) {} // la posición la restauramos nosotros, con las imágenes ya cargadas
const POSKEY = "pos_" + c; // por dónde vas en este capítulo
let listo = false;           // hasta que no se ha restaurado la posición no se guarda nada
if(!cap || cap.proximo) location.replace("index.html#leer");
else arranca();

function arranca(){
  const completo = cap.titulo + (cap.nombre ? ": " + cap.nombre : "");
  document.title = completo + " | DEADLY SWAMPED";
  const md = document.querySelector('meta[name=description]');
  if(md) md.content = "Read " + completo + " of DEADLY SWAMPED, a webtoon set in the world of Nyris." + (cap.sinopsis ? " " + cap.sinopsis : "");

  // enlace canónico de este capítulo (le dice a Google y a GoatCounter cuál es su dirección)
  let can = document.querySelector('link[rel=canonical]');
  if(!can){ can = document.createElement("link"); can.rel = "canonical"; document.head.appendChild(can); }
  can.href = SITE + "leer.html?c=" + c;

  // aviso de contenido (franja normal, nunca una ventana)
  const aviso = cap.aviso !== undefined ? cap.aviso : AVISO_CONTENIDO;
  if(aviso){ $("cwtxt").textContent = aviso; $("cw").hidden = false; }

  // nota del autor: cada línea es un párrafo
  if(cap.nota){
    String(cap.nota).split("\n").filter(t => t.trim()).forEach(t => { const p = document.createElement("p"); p.textContent = t; $("notatxt").appendChild(p); });
    $("nota").hidden = false;
  }
  if(cap.nombre){ $("num").textContent = cap.titulo; $("tit").textContent = cap.nombre; }
  else { $("num").hidden = true; $("tit").textContent = cap.titulo; }
  if(cap.fecha) $("fecha").textContent = new Date(cap.fecha + "T00:00").toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"});

  // redes (barra de arriba y pie en móvil)
  const iconos = REDES.map(r => `<a class="ico" href="${r.u}" target="_blank" rel="noopener noreferrer" aria-label="${r.n}"><svg viewBox="0 0 24 24"${r.linea ? ' style="fill:none;stroke:currentColor;stroke-width:2"' : ""}>${r.d}</svg></a>`).join("");
  document.querySelectorAll(".redes").forEach(e => e.innerHTML = iconos);

  // páginas: lista de nombres, o numeradas 01, 02, 03... dentro de la carpeta del capítulo
  const paginas = Array.isArray(cap.paginas) ? cap.paginas.map(p => cap.carpeta ? cap.carpeta + "/" + p : p)
    : Array.from({length: cap.paginas || 0}, (_, i) => `${cap.carpeta}/${String(i+1).padStart(2,"0")}.${cap.ext || "jpg"}`);
  pinta(paginas);
  restaura();

  // anterior / siguiente (no salta a capítulos sin publicar)
  const enlace = (a, i) => { const ok = i >= 0 && i < capitulos.length && !capitulos[i].proximo; a.href = ok ? "leer.html?c=" + i : "#"; a.setAttribute("aria-disabled", !ok); };
  [["ant","ant2",c-1],["sig","sig2",c+1]].forEach(([a,b,i]) => { enlace($(a), i); enlace($(b), i); });

  // el like solo se guarda en el navegador de quien lo pulsa (no hay contador compartido)
  const clave = "like_" + c;
  const pintaLike = on => { $("like").setAttribute("aria-pressed", on); $("liketxt").textContent = on ? "Liked" : "Like"; };
  let like = false; try { like = localStorage.getItem(clave) === "1"; } catch(_) {}
  pintaLike(like);
  $("like").onclick = () => { like = !like; pintaLike(like); try { localStorage.setItem(clave, like ? "1" : "0"); } catch(_) {} };

  // probar con imágenes del ordenador (solo las ves tú)
  if(new URLSearchParams(location.search).has("probar")) $("probar").hidden = false;
  $("prueba").onchange = e => { listo = false; pinta([...e.target.files].sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true})).map(f => URL.createObjectURL(f))); };

  // un poco de disuasión contra copiar las páginas (no es una protección real)
  $("tira").addEventListener("contextmenu", e => e.preventDefault());
  $("tira").addEventListener("dragstart", e => e.preventDefault());

  // teclado: ← → cambian de capítulo (↑ ↓ y la barra espaciadora hacen scroll como siempre)
  addEventListener("keydown", e => {
    if(e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.repeat) return;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    const a = e.key === "ArrowLeft" ? $("ant") : e.key === "ArrowRight" ? $("sig") : null;
    if(a && a.getAttribute("aria-disabled") !== "true"){ e.preventDefault(); guardaPos(); location.href = a.href; }
  });

  // volver arriba
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  $("arriba").onclick = () => scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});

  // recordar por dónde vas (se guarda en el navegador de cada lector)
  let tPos; const guardaLuego = () => { clearTimeout(tPos); tPos = setTimeout(guardaPos, 250); };
  addEventListener("scroll", guardaLuego, {passive:true});
  addEventListener("pagehide", guardaPos);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") guardaPos(); });
  $("reinicia").onclick = () => { try { localStorage.removeItem(POSKEY); } catch(_) {} $("retoma").hidden = true; scrollTo(0, 0); };

  // enlace para avisar de errores
  if(CONTACTO.usuario && CONTACTO.dominio){
    $("mail").href = "mailto:" + CONTACTO.usuario + "@" + CONTACTO.dominio + "?subject=" + encodeURIComponent("Problem in " + completo);
    $("mail").hidden = false;
  }

  // estadísticas sin cookies: cada capítulo cuenta como su propia página
  if(STATS){
    window.goatcounter = {path: "/read/chapter-" + (c + 1)};
    const g = document.createElement("script");
    g.async = true; g.src = "https://gc.zgo.at/count.js";
    g.dataset.goatcounter = "https://" + STATS + ".goatcounter.com/count";
    document.head.appendChild(g);
  }

  // barra de progreso
  addEventListener("scroll", () => { const h = document.documentElement; $("prog").style.width = (h.scrollTop / ((h.scrollHeight - h.clientHeight) || 1) * 100) + "%"; $("arriba").classList.toggle("ver", h.scrollTop > 800); }, {passive:true});
}

/* POSICIÓN dentro del capítulo: se guarda la página en la que estás y cuánto has bajado de ella
   (así funciona aunque las imágenes carguen a distinto ritmo o cambies de pantalla) */
function hijos(){ return [...$("tira").children]; }
function topDe(el){ return el.getBoundingClientRect().top + scrollY; }
function guardaPos(){
  const L = hijos(); if(!listo || !L.length) return;
  try{
    const termino = $("tira").getBoundingClientRect().bottom <= innerHeight + 30;
    if(termino || scrollY < 60){ localStorage.removeItem(POSKEY); return; } // capítulo terminado o sin empezar: la próxima vez desde arriba
    let k = 0; for(let i = 0; i < L.length; i++){ if(topDe(L[i]) <= scrollY + 2) k = i; else break; }
    const r = L[k].getBoundingClientRect();
    localStorage.setItem(POSKEY, JSON.stringify({p:k, f:+Math.min(1, Math.max(0, -r.top / (r.height || 1))).toFixed(3)}));
  }catch(_){}
}
async function restaura(){
  let g = null; try{ g = JSON.parse(localStorage.getItem(POSKEY)); }catch(_){}
  const L = hijos();
  if(!g || !(g.p > 0 || g.f > .02) || g.p >= L.length || new URLSearchParams(location.search).has("probar")){ listo = true; return; }
  // las páginas anteriores se cargan ya para que el scroll caiga en el sitio exacto
  L.slice(0, g.p + 1).forEach(i => { if(i.tagName === "IMG") i.loading = "eager"; });
  const espera = L.slice(0, g.p + 1).filter(i => i.tagName === "IMG" && !i.complete)
    .map(i => new Promise(r => { i.addEventListener("load", r, {once:true}); i.addEventListener("error", r, {once:true}); }));
  await Promise.race([Promise.all(espera), new Promise(r => setTimeout(r, 5000))]);
  const el = hijos()[g.p];
  scrollTo(0, topDe(el) + g.f * el.offsetHeight);
  $("retoma").hidden = false; setTimeout(() => { $("retoma").hidden = true; }, 9000);
  setTimeout(() => { listo = true; }, 400);
}

function pinta(lista){
  $("tira").innerHTML = lista.length ? lista.map((u,i) => `<img src="${u}" alt="Page ${i+1}" draggable="false" ${i>1 ? 'loading="lazy"' : ""}>`).join("")
    : Array.from({length:6}, (_, i) => `<div class="demo"><div>Page ${i+1}${i===0 ? '<small>This is a sample page. Put your images in the chapter folder and set how many there are in capitulos.js.</small>' : ""}</div></div>`).join("");
}

</script>
